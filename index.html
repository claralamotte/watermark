<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF Watermark</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📄</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <style>
    :root {
      --bg: #f5f0e8;
      --surface: #ffffff;
      --border: #ddd6c8;
      --border-focus: #b8ad9a;
      --navy: #01244a;
      --navy-light: #0085ca;
      --navy-muted: #3a5478;
      --text: #01244a;
      --text-sec: #6b7a8d;
      --gray-tag: #8a8a8a;
      --accent: #01244a;
      --accent-hover: #0a3260;
      --danger: #b33a3a;
      --radius: 8px;
      --radius-lg: 12px;
      --tr: 0.2s cubic-bezier(0.4,0,0.2,1);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center}
    .app{max-width:460px;width:100%;margin:0 auto;padding:3rem 1.25rem}

    header{margin-bottom:2.5rem;text-align:center}
    .am-logo{margin-bottom:1rem}
    .am-logo img{height:38px;display:inline-block}
    header h1{font-size:1.65rem;font-weight:800;letter-spacing:-0.03em;color:var(--navy);line-height:1.1;margin-bottom:0.75rem}
    .tagline{color:var(--gray-tag);font-size:0.82rem;font-weight:400;letter-spacing:-0.005em}

    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.75rem;box-shadow:0 1px 3px rgba(1,36,74,0.06)}
    .section-label{font-size:0.62rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--navy-muted);margin-bottom:0.75rem}

    .dropzone{border:1.5px dashed var(--border);border-radius:var(--radius);padding:2rem 1.25rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.55rem;cursor:pointer;transition:all var(--tr)}
    .dropzone:hover{border-color:var(--navy-muted);background:rgba(1,36,74,0.02)}
    .dropzone.dragging{border-color:var(--navy);background:rgba(1,36,74,0.04);border-style:solid}
    .dropzone-icon{color:var(--navy-muted);opacity:0.4}
    .dropzone-text{font-size:0.84rem;font-weight:600;color:var(--navy)}
    .dropzone-hint{font-size:0.72rem;color:var(--text-sec)}

    .file-card{display:flex;align-items:center;justify-content:space-between;padding:0.7rem 0.85rem;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg)}
    .file-info{display:flex;align-items:center;gap:0.6rem;min-width:0}
    .file-icon{background:var(--navy);color:#fff;font-size:0.55rem;font-weight:700;letter-spacing:0.06em;padding:0.28rem 0.42rem;border-radius:4px;flex-shrink:0}
    .file-name{font-size:0.8rem;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .file-meta{font-size:0.7rem;color:var(--text-sec);margin-top:1px}
    .remove-btn{background:none;border:none;cursor:pointer;color:var(--text-sec);padding:0.2rem;border-radius:5px;transition:all var(--tr);display:flex;flex-shrink:0}
    .remove-btn:hover{color:var(--danger);background:rgba(179,58,58,0.08)}

    .divider{height:1px;background:var(--border);margin:1.35rem 0}

    .watermark-input{width:100%;font-family:'Inter',system-ui,sans-serif;font-size:0.85rem;padding:0.7rem 0.9rem;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);color:var(--text);resize:none;outline:none;transition:border-color var(--tr);line-height:1.5}
    .watermark-input::placeholder{color:var(--text-sec);opacity:0.5}
    .watermark-input:focus{border-color:var(--navy)}

    .export-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:0.45rem;padding:0.75rem 1.25rem;background:var(--navy);color:#fff;border:none;border-radius:var(--radius);font-family:'Inter',system-ui,sans-serif;font-size:0.84rem;font-weight:600;cursor:pointer;transition:all var(--tr);margin-top:1.35rem;letter-spacing:0.01em}
    .export-btn:hover:not(.disabled){background:var(--accent-hover);transform:translateY(-1px);box-shadow:0 4px 14px rgba(1,36,74,0.2)}
    .export-btn.disabled{opacity:0.25;cursor:not-allowed}
    .spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;display:inline-block}
    @keyframes spin{to{transform:rotate(360deg)}}
    .error-msg{font-size:0.75rem;color:var(--danger);padding:0.55rem 0.75rem;background:rgba(179,58,58,0.06);border-radius:6px;margin-top:1rem}

    .settings-toggle{display:flex;align-items:center;gap:0.35rem;background:none;border:none;cursor:pointer;color:var(--text-sec);font-family:'Inter',system-ui,sans-serif;font-size:0.7rem;font-weight:500;padding:0;margin-top:1.1rem;transition:color var(--tr)}
    .settings-toggle:hover{color:var(--navy)}
    .settings-toggle svg{transition:transform var(--tr)}
    .settings-toggle.open svg{transform:rotate(180deg)}
    .settings-drawer{max-height:0;overflow:hidden;transition:max-height 0.4s ease,opacity 0.3s ease;opacity:0}
    .settings-drawer.open{max-height:600px;opacity:1}
    .settings-inner{padding-top:0.9rem}
    .control-group{margin-bottom:0.75rem}
    .control-group label{display:flex;align-items:center;justify-content:space-between;font-size:0.72rem;font-weight:500;margin-bottom:0.3rem;color:var(--navy)}
    .val{font-size:0.65rem;color:var(--text-sec);font-weight:400;font-variant-numeric:tabular-nums}
    .control-row{display:grid;grid-template-columns:1fr 1fr;gap:0.75rem}
    input[type="range"]{width:100%;height:3px;appearance:none;background:var(--border);border-radius:2px;outline:none;cursor:pointer}
    input[type="range"]::-webkit-slider-thumb{appearance:none;width:13px;height:13px;background:var(--navy);border-radius:50%;cursor:pointer}
    input[type="range"]::-moz-range-thumb{width:13px;height:13px;background:var(--navy);border:none;border-radius:50%}
    .color-pick{display:flex;align-items:center;gap:0.45rem}
    .color-pick input[type="color"]{width:26px;height:26px;border:1px solid var(--border);border-radius:5px;cursor:pointer;padding:2px;background:none}
    .color-hex{font-size:0.68rem;color:var(--text-sec);font-variant-numeric:tabular-nums}

    .angle-hints{display:flex;gap:0.4rem;margin-top:0.35rem;flex-wrap:wrap}
    .angle-hint{font-size:0.58rem;color:var(--text-sec);background:var(--bg);padding:0.18rem 0.45rem;border-radius:4px;cursor:pointer;transition:all var(--tr);border:1px solid transparent;white-space:nowrap}
    .angle-hint:hover{color:var(--navy);border-color:var(--border)}
    .angle-hint.active{color:var(--navy);font-weight:600;border-color:var(--navy-muted)}

    .font-size-note{font-size:0.62rem;color:var(--text-sec);margin-top:0.3rem;font-style:italic}

    footer{text-align:center;padding:1.5rem 0 0;font-size:0.68rem;color:var(--text-sec);opacity:0.55}
    .hidden{display:none}
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="am-logo">
        <img src="https://www.alvarezandmarsal.com/themes/custom/am/logo.svg" alt="Alvarez & Marsal" />
      </div>
      <h1>PDF Watermark</h1>
      <p class="tagline">Filigrane sur tous vos documents en 2 sec</p>
    </header>

    <div class="card">
      <div class="section-label">Document</div>
      <div id="dropzone" class="dropzone">
        <input type="file" id="fileInput" accept="application/pdf" style="display:none"/>
        <div class="dropzone-icon">
          <svg width="32" height="32" viewBox="0 0 40 40" fill="none">
            <path d="M20 6v20M12 14l8-8 8 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M6 28h28v4a2 2 0 01-2 2H8a2 2 0 01-2-2v-4z" stroke="currentColor" stroke-width="2"/>
          </svg>
        </div>
        <span class="dropzone-text">Glissez votre PDF ici</span>
        <span class="dropzone-hint">ou cliquez pour parcourir</span>
      </div>
      <div id="fileCard" class="file-card hidden">
        <div class="file-info">
          <div class="file-icon">PDF</div>
          <div style="min-width:0">
            <div class="file-name" id="fileName"></div>
            <div class="file-meta" id="fileMeta"></div>
          </div>
        </div>
        <button class="remove-btn" id="removeBtn" title="Retirer">
          <svg width="16" height="16" viewBox="0 0 18 18" fill="none"><path d="M5 5l8 8M13 5l-8 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>

      <div class="divider"></div>

      <div class="section-label">Filigrane</div>
      <textarea id="watermarkText" class="watermark-input" rows="1" placeholder="Ex : CONFIDENTIEL"></textarea>

      <button class="settings-toggle" id="settingsToggle">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Paramètres avancés
      </button>
      <div class="settings-drawer" id="settingsDrawer">
        <div class="settings-inner">
          <div class="control-group">
            <label>
              Taille police
              <span class="val" id="sizeVal">Auto</span>
            </label>
            <input type="range" id="fontSize" min="8" max="200" value="0"/>
            <div class="font-size-note" id="fontSizeNote">Adapté automatiquement au nombre de caractères</div>
          </div>

          <div class="control-group">
            <label>Rotation <span class="val" id="rotationVal">52°</span></label>
            <input type="range" id="rotation" min="-90" max="90" value="52"/>
            <div class="angle-hints">
              <span class="angle-hint" data-angle="0" data-auto="false">Horizontal : 0°</span>
              <span class="angle-hint" data-angle="90" data-auto="false">Vertical : 90°</span>
              <span class="angle-hint" data-angle="45" data-auto="true">Diagonale : 31° – 59°</span>
            </div>
          </div>

          <div class="control-row">
            <div class="control-group">
              <label>Transparence <span class="val" id="transpVal">40%</span></label>
              <input type="range" id="transparency" min="0" max="100" value="40"/>
            </div>
            <div class="control-group">
              <label>Couleur</label>
              <div class="color-pick">
                <input type="color" id="color" value="#767a7f"/>
                <span class="color-hex" id="colorHex">#767a7f</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div id="errorMsg" class="error-msg hidden"></div>

      <button class="export-btn disabled" id="exportBtn" disabled>
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none">
          <path d="M10 3v10M6 9l4 4 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M3 14v2a2 2 0 002 2h10a2 2 0 002-2v-2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        Exporter
      </button>
    </div>

    <footer>Aucun fichier envoyé — traitement 100% navigateur</footer>
  </div>

  <script>
    const { PDFDocument, rgb, degrees, StandardFonts } = PDFLib;
    const FONT_KEY = StandardFonts.Helvetica;

    let pdfFile = null, pdfBytes = null, pageCount = 0;
    let autoMode = false; // default: fixed 52°, not auto-diagonal
    let fontSizeAuto = true; // default: adaptive font size

    const $ = id => document.getElementById(id);
    const dropzone = $('dropzone'), fileInput = $('fileInput'), fileCard = $('fileCard');
    const fileNameEl = $('fileName'), fileMetaEl = $('fileMeta'), removeBtn = $('removeBtn');
    const watermarkText = $('watermarkText');
    const fontSizeInput = $('fontSize'), rotationInput = $('rotation');
    const transparencyInput = $('transparency'), colorInput = $('color');
    const exportBtn = $('exportBtn'), errorMsg = $('errorMsg');
    const sizeVal = $('sizeVal'), rotationVal = $('rotationVal');
    const transpVal = $('transpVal'), colorHex = $('colorHex');
    const settingsToggle = $('settingsToggle'), settingsDrawer = $('settingsDrawer');
    const angleHints = document.querySelectorAll('.angle-hint');
    const fontSizeNote = $('fontSizeNote');
    const exportBtnDefault = exportBtn.innerHTML;

    function showError(m){errorMsg.textContent=m;errorMsg.classList.remove('hidden')}
    function hideError(){errorMsg.classList.add('hidden')}
    function updateBtn(){const ok=pdfFile&&watermarkText.value.trim();exportBtn.classList.toggle('disabled',!ok);exportBtn.disabled=!ok}
    function hexToRgb(h){return{r:parseInt(h.slice(1,3),16)/255,g:parseInt(h.slice(3,5),16)/255,b:parseInt(h.slice(5,7),16)/255}}

    /**
     * Compute adaptive font size based on text length and page diagonal.
     * Targets ~55% of the page diagonal width, capped to reasonable bounds.
     * Short texts get bigger font, long texts get smaller font.
     */
    function computeAdaptiveFontSize(font, text, pageWidth, pageHeight) {
      const diagonal = Math.sqrt(pageWidth * pageWidth + pageHeight * pageHeight);
      const targetWidth = diagonal * 0.55;
      // Binary search for the font size that fills targetWidth
      let lo = 8, hi = 600, mid;
      for (let i = 0; i < 20; i++) {
        mid = (lo + hi) / 2;
        const tw = font.widthOfTextAtSize(text, mid);
        if (tw < targetWidth) lo = mid;
        else hi = mid;
      }
      return Math.round(mid);
    }

    function updateHintHighlight() {
      angleHints.forEach(h => {
        if (autoMode && h.dataset.auto === 'true') {
          h.classList.add('active');
        } else if (!autoMode && h.dataset.auto === 'false' && parseInt(h.dataset.angle) === parseInt(rotationInput.value)) {
          h.classList.add('active');
        } else {
          h.classList.remove('active');
        }
      });
    }

    function updateRotationDisplay() {
      if (autoMode) {
        rotationVal.textContent = 'Auto (diagonale)';
      } else {
        rotationVal.textContent = rotationInput.value + '°';
      }
      updateHintHighlight();
    }

    function updateFontSizeDisplay() {
      if (fontSizeAuto) {
        sizeVal.textContent = 'Auto';
        fontSizeNote.classList.remove('hidden');
      } else {
        sizeVal.textContent = fontSizeInput.value + ' px';
        fontSizeNote.classList.add('hidden');
      }
    }

    fontSizeInput.addEventListener('input', () => {
      // If user moves the slider, exit auto mode
      fontSizeAuto = false;
      // Slider value 0 means auto, everything above is manual
      if (parseInt(fontSizeInput.value) === 0) {
        fontSizeAuto = true;
      }
      updateFontSizeDisplay();
    });

    rotationInput.addEventListener('input', () => {
      autoMode = false;
      updateRotationDisplay();
    });

    transparencyInput.addEventListener('input', () => { transpVal.textContent = transparencyInput.value + '%'; });
    colorInput.addEventListener('input', () => { colorHex.textContent = colorInput.value; });
    settingsToggle.addEventListener('click', () => { settingsToggle.classList.toggle('open'); settingsDrawer.classList.toggle('open'); });

    angleHints.forEach(hint => {
      hint.addEventListener('click', () => {
        if (hint.dataset.auto === 'true') {
          autoMode = true;
          rotationInput.value = 45;
        } else {
          autoMode = false;
          rotationInput.value = hint.dataset.angle;
        }
        updateRotationDisplay();
      });
    });

    async function handleFile(f){
      hideError();
      if(!f||f.type!=='application/pdf'){showError('Fichier PDF requis.');return}
      if(f.size>50*1024*1024){showError('Max 50 Mo.');return}
      try{
        pdfBytes=await f.arrayBuffer();
        const d=await PDFDocument.load(pdfBytes);
        pageCount=d.getPageCount();pdfFile=f;
        fileNameEl.textContent=f.name;
        fileMetaEl.textContent=pageCount+' page'+(pageCount>1?'s':'');
        dropzone.classList.add('hidden');fileCard.classList.remove('hidden');updateBtn();
      }catch{showError('Impossible de lire ce PDF.')}
    }
    function removePdf(){pdfFile=null;pdfBytes=null;pageCount=0;fileInput.value='';fileCard.classList.add('hidden');dropzone.classList.remove('hidden');hideError();updateBtn()}

    dropzone.addEventListener('click',()=>fileInput.click());
    fileInput.addEventListener('change',e=>handleFile(e.target.files[0]));
    dropzone.addEventListener('dragover',e=>{e.preventDefault();dropzone.classList.add('dragging')});
    dropzone.addEventListener('dragleave',e=>{e.preventDefault();dropzone.classList.remove('dragging')});
    dropzone.addEventListener('drop',e=>{e.preventDefault();dropzone.classList.remove('dragging');handleFile(e.dataTransfer.files[0])});
    removeBtn.addEventListener('click',removePdf);
    watermarkText.addEventListener('input',updateBtn);

    exportBtn.addEventListener('click', async () => {
      if (!pdfFile || !watermarkText.value.trim()) return;
      exportBtn.disabled = true;
      exportBtn.innerHTML = '<span class="spinner"></span>';
      hideError();

      try {
        const doc = await PDFDocument.load(pdfBytes);
        const font = await doc.embedFont(FONT_KEY);

        const transparency = parseInt(transparencyInput.value);
        const op = 1 - (transparency / 100);
        const { r, g, b } = hexToRgb(colorInput.value);
        const text = watermarkText.value.trim();
        const manualFontSize = parseInt(fontSizeInput.value);

        for (const page of doc.getPages()) {
          const { width, height } = page.getSize();

          // Rotation
          let angleDeg;
          if (autoMode) {
            const diagAngleRad = Math.atan2(height, width);
            angleDeg = diagAngleRad * (180 / Math.PI);
          } else {
            angleDeg = parseInt(rotationInput.value);
          }
          const angleRad = angleDeg * (Math.PI / 180);

          // Font size: auto-adaptive or manual
          const fontSize = fontSizeAuto
            ? computeAdaptiveFontSize(font, text, width, height)
            : manualFontSize;

          // Center text on page
          const tw = font.widthOfTextAtSize(text, fontSize);
          const cosA = Math.cos(angleRad);
          const sinA = Math.sin(angleRad);
          const cx = width / 2;
          const cy = height / 2;
          const x = cx - (tw / 2) * cosA;
          const y = cy - (tw / 2) * sinA;

          page.drawText(text, {
            x, y,
            size: fontSize,
            font,
            color: rgb(r, g, b),
            opacity: op,
            rotate: degrees(angleDeg),
          });
        }

        const out = await doc.save();
        const blob = new Blob([out], { type: 'application/pdf' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = pdfFile.name.replace(/\.pdf$/i, '') + '_watermarked.pdf';
        a.click();
        URL.revokeObjectURL(url);
      } catch (err) { showError('Erreur : ' + err.message); }

      exportBtn.innerHTML = exportBtnDefault;
      exportBtn.disabled = false;
      updateBtn();
    });

    // Initialize display
    updateFontSizeDisplay();
    updateRotationDisplay();
  </script>
</body>
</html>
